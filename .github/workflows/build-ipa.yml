name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      status:
        description: 'Trigger manually'
        required: false

env:
  FLUTTER_VERSION: '3.27.0'
  IOS_DEPLOYMENT_TARGET: '16.0'

jobs:
  build_ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: arm64

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Pub get
        run: flutter pub get

      - name: Analyze (optional, non-fatal)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Generate iOS export options
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA from built .app
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r DOEImproved.ipa Payload
          echo "IPA size: $(du -h DOEImproved.ipa | cut -f1)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DOEImproved-unsigned
          path: build/ios/Release-iphoneos/DOEImproved.ipa
          compression-level: 9
          retention-days: 30
