name: doe_improved
description: A commercial-grade student portal dashboard for NYC Public Schools (TeachHub SSO + grade analytics).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  webview_flutter: ^4.8.0
  http: ^1.2.1
  html: ^0.15.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true