name: Generate iOS platform files

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Trigger to generate ios/ directory'
        required: false

env:
  FLUTTER_VERSION: '3.27.0'

jobs:
  generate:
    name: Generate ios/ platform directory
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Generate ios/ via flutter create
        run: |
          flutter create --platforms ios --project-name doe_improved .

      - name: Commit generated ios/ files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain ios/)" ]; then
            git add -f ios/
            git commit -m "chore: generate iOS platform directory via flutter create"
            git push
          else
            echo "Nothing to commit"
          fi